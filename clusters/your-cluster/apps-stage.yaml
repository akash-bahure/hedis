apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:my-org/myapp-monorepo.git
    targetRevision: main
    path: infra/k8s/environments/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
