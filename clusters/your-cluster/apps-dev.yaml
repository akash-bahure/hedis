apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-dev
  namespace: argocd
  annotations:
    # ArgoCD Image Updater — automatically deploy new dev-latest images
    argocd-image-updater.argoproj.io/image-list: web=ghcr.io/my-org/web
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^dev-.*$
    argocd-image-updater.argoproj.io/web.update-strategy: digest
    argocd-image-updater.argoproj.io/web.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
spec:
  project: default
  source:
    repoURL: git@github.com:my-org/myapp-monorepo.git
    targetRevision: main
    path: infra/k8s/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
