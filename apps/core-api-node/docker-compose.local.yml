services:
  backend:
    build:
      context: .
      dockerfile: ./compose/local/Dockerfile
    container_name: core-api-node
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authdb
      DB_PORT: 5432
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start
  redis:
    image: redis:7.2
    container_name: hedis_local_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hedis_local_redis_data:/data
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: myapp_local_mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

  db:
    image: postgres:15
    container_name: postgres-node
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  hedis_local_redis_data:
