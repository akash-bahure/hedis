server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — fall back to index.html for any unknown path
  location / {
    try_files $uri /index.html;
  }

  # Long-lived cache for hashed assets (Vite adds content hash to filenames)
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 1024;
}
