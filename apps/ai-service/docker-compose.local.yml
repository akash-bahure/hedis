# Local development infrastructure for ai-service.
# Start with:  make dev-infra  (or docker compose -f docker-compose.local.yml up -d)

volumes:
  myapp_ai_postgres_data: {}
  myapp_ai_phoenix_data: {}

services:
  # ── PostgreSQL (ADK Session Store) ───────────────────────────────────────
  # Port 5433 to avoid conflict with core-api's PostgreSQL on 5432.
  ai-postgres:
    image: docker.io/postgres:17
    container_name: myapp_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_service
    volumes:
      - myapp_ai_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Arize Phoenix (Observability) ────────────────────────────────────────
  # UI: http://localhost:6006  |  OTLP gRPC: localhost:4317
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: myapp_ai_phoenix
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:postgres@ai-phoenix-db:5432/phoenix
      PHOENIX_WORKING_DIR: /phoenix/data
    volumes:
      - myapp_ai_phoenix_data:/phoenix/data
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC collector
    depends_on:
      ai-phoenix-db:
        condition: service_healthy

  # ── Phoenix PostgreSQL (separate DB for Phoenix storage) ─────────────────
  ai-phoenix-db:
    image: docker.io/postgres:17
    container_name: myapp_ai_phoenix_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoenix
    tmpfs:
      - /var/lib/postgresql/data  # ephemeral — Phoenix data is not critical locally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
