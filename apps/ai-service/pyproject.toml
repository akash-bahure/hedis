[project]
name = "ai-service"
version = "0.1.0"
description = "AI agent service for myapp — powered by Google ADK"
requires-python = "==3.13.*"
dependencies = [
    # ── Google ADK ───────────────────────────────────────────────────────
    "google-adk>=1.25",

    # ── Web Framework ────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.0",

    # ── Database (async driver for DatabaseSessionService) ───────────────
    "asyncpg>=0.30",

    # ── Artifact Storage (cloud-agnostic) ────────────────────────────────
    "adk-extra-services>=0.1",

    # ── Observability (Phoenix + OpenTelemetry) ──────────────────────────
    "arize-phoenix-otel>=0.8",
    "openinference-instrumentation-google-adk>=0.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
