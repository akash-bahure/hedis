volumes:
  myapp_local_postgres_data: {}
  myapp_local_postgres_data_backups: {}
  myapp_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: myapp_local_django
    container_name: myapp_local_django
    depends_on:
      - pgbouncer
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: myapp_production_postgres
    container_name: myapp_local_postgres
    volumes:
      - myapp_local_postgres_data:/var/lib/postgresql/18/docker
      - myapp_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    container_name: myapp_local_pgbouncer
    depends_on:
      - postgres
    env_file:
      - ./.envs/.local/.postgres
    volumes:
      - ./compose/production/pgbouncer/entrypoint:/entrypoint:ro
    entrypoint: ["/bin/sh", "/entrypoint"]
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[p]gbouncer'"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: myapp_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: myapp_local_redis
    volumes:
      - myapp_local_redis_data:/data

  celeryworker:
    <<: *django
    image: myapp_local_celeryworker
    container_name: myapp_local_celeryworker
    depends_on:
      - redis
      - pgbouncer
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: myapp_local_celerybeat
    container_name: myapp_local_celerybeat
    depends_on:
      - redis
      - pgbouncer
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: myapp_local_flower
    container_name: myapp_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
