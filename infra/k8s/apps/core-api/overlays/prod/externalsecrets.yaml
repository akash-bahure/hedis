apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: core-api-secrets
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: core-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: kv/core-api/prod
        property: DJANGO_SECRET_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kv/core-api/prod
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: kv/core-api/prod
        property: POSTGRES_USER
    - secretKey: POSTGRES_DB
      remoteRef:
        key: kv/core-api/prod
        property: POSTGRES_DB
    - secretKey: CELERY_FLOWER_USER
      remoteRef:
        key: kv/core-api/prod
        property: CELERY_FLOWER_USER
    - secretKey: CELERY_FLOWER_PASSWORD
      remoteRef:
        key: kv/core-api/prod
        property: CELERY_FLOWER_PASSWORD
    - secretKey: SENTRY_DSN
      remoteRef:
        key: kv/core-api/prod
        property: SENTRY_DSN
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: prod
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: kv/ghcr/prod
        property: dockerconfigjson
