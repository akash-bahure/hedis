apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml
  - certificate.yaml
  - externalsecrets.yaml
  - flower-ingress.yaml
  - flower-certificate.yaml
  - basic-auth-secret.yaml
  - basic-auth-middleware.yaml

images:
  - name: ghcr.io/my-org/django
    newTag: prod-latest
  - name: ghcr.io/my-org/celeryworker
    newTag: prod-latest
  - name: ghcr.io/my-org/celerybeat
    newTag: prod-latest
  - name: ghcr.io/my-org/flower
    newTag: prod-latest
