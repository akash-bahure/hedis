apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: dev
  labels:
    app: core-api
    component: mailpit
spec:
  selector:
    app: core-api
    component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
