apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: qa
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: qa-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mailpit.qa.example.com
      secretName: mailpit-qa-tls
  rules:
    - host: mailpit.qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
