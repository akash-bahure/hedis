apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core-api
  namespace: qa
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.qa.example.com
      secretName: api-qa-tls
  rules:
    - host: api.qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  number: 5000
