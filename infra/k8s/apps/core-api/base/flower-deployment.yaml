apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  labels:
    app: core-api
    component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-api
      component: flower
  template:
    metadata:
      labels:
        app: core-api
        component: flower
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: flower
          image: ghcr.io/my-org/flower:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5555
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: core-api-config
            - secretRef:
                name: core-api-secrets
          command: ["/start-flower"]
