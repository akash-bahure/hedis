apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: core-api
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-api
      component: redis
  template:
    metadata:
      labels:
        app: core-api
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
