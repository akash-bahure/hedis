apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: qa
data:
  ENVIRONMENT: "production"
  APP_NAME: "ai-service"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8080"
  DEFAULT_MODEL: "gemini-2.0-flash"
  DATABASE_URL: "postgresql+asyncpg://ai-service:$(POSTGRES_PASSWORD)@core-api-pgbouncer:6432/ai_service"
  ARTIFACT_BACKEND: "s3"
  PHOENIX_ENABLED: "true"
  PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:4317"
  PHOENIX_PROJECT_NAME: "ai-service"
