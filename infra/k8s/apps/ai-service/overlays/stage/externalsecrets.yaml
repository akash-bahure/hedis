apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
  namespace: stage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: ai-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: kv/ai-service/stage
        property: GOOGLE_API_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kv/ai-service/stage
        property: POSTGRES_PASSWORD
    - secretKey: ARTIFACT_S3_BUCKET
      remoteRef:
        key: kv/ai-service/stage
        property: ARTIFACT_S3_BUCKET
    - secretKey: ARTIFACT_S3_ENDPOINT
      remoteRef:
        key: kv/ai-service/stage
        property: ARTIFACT_S3_ENDPOINT
    - secretKey: ARTIFACT_S3_ACCESS_KEY
      remoteRef:
        key: kv/ai-service/stage
        property: ARTIFACT_S3_ACCESS_KEY
    - secretKey: ARTIFACT_S3_SECRET_KEY
      remoteRef:
        key: kv/ai-service/stage
        property: ARTIFACT_S3_SECRET_KEY
